<svg viewBox="0 0 512 512" role="img">
  <title>OnboardCI Checkpoint Gate Logo (Monochrome)</title>
  <desc>Single-color contrast version of OnboardCI checkpoint gate for dark and light backgrounds</desc>
  <rect width="512" height="512" rx="96" fill="#0B1220" stroke="#64748B" stroke-width="8"/>
  <!-- Container Wall Framing Bars -->
  <rect x="88" y="96" width="36" height="320" rx="12" fill="#F8FAFC"/>
  <rect x="388" y="96" width="36" height="320" rx="12" fill="#F8FAFC"/>
  <!-- Checkpoint Gate Canopy Lintel -->
  <rect x="156" y="96" width="200" height="36" rx="12" fill="#F8FAFC"/>
  <!-- Checkpoint Verification Threshold (Checkmark) -->
  <path d="M164 260 L236 332 L348 172" fill="none" stroke="#F8FAFC" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
