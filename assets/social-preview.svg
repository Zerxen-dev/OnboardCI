<svg viewBox="0 0 1280 640" role="img">
  <title>OnboardCI Social Preview</title>
  <desc>Verify that new contributors can actually set up your open-source repo by following your docs.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="25%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#F8FAFC" stroke-width="1" opacity="0.035"/>
    </pattern>
  </defs>

  <!-- Deep Ink Base Canvas -->
  <rect width="1280" height="640" fill="#0B1220"/>
  <rect width="1280" height="640" fill="url(#bgGlow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Left Side: Large Hero Abstract Gate Mark -->
  <g transform="translate(100, 144) scale(0.6875)">
    <!-- Container Card with subtle border -->
    <rect width="512" height="512" rx="110" fill="#0F172A" stroke="#22C55E" stroke-opacity="0.25" stroke-width="4"/>
    <!-- Pillar -->
    <rect x="112" y="128" width="64" height="256" rx="20" fill="#22C55E"/>
    <!-- Chevron Canopy -->
    <path d="M 224 136 A 16 16 0 0 1 240 128 L 384 212 A 16 16 0 0 1 384 238 L 348 260 A 16 16 0 0 1 328 256 L 216 188 A 16 16 0 0 1 212 172 L 216 148 A 16 16 0 0 1 224 136 Z" fill="#22C55E"/>
    <!-- Checkmark Threshold -->
    <path d="M 220 288 L 272 360 A 20 20 0 0 0 304 360 L 404 180 A 16 16 0 0 0 388 156 L 352 156 A 16 16 0 0 0 338 166 L 288 288 L 252 244 A 16 16 0 0 0 228 244 L 216 260 A 16 16 0 0 0 220 288 Z" fill="#22C55E"/>
  </g>

  <!-- Right Side: Content Block -->
  <!-- Eyebrow Category -->
  <text x="508" y="196" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#22C55E" letter-spacing="2">AUTOMATED ONBOARDING VERIFICATION</text>

  <!-- Title -->
  <text x="508" y="278" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="76" letter-spacing="-2">
    <tspan font-weight="800" fill="#F8FAFC">Onboard</tspan><tspan font-weight="400" fill="#22C55E">CI</tspan>
  </text>

  <!-- Subtitle -->
  <text x="508" y="340" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="23" font-weight="400" fill="#94A3B8" letter-spacing="-0.3">
    Verify that new contributors can actually set up
  </text>
  <text x="508" y="374" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="23" font-weight="400" fill="#94A3B8" letter-spacing="-0.3">
    your open-source repo.
  </text>

  <!-- Feature Pill Badges -->
  <!-- Badge 1: Docker Sandboxed -->
  <g transform="translate(508, 436)">
    <rect width="186" height="40" rx="20" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="5" fill="#22C55E"/>
    <text x="34" y="26" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#F8FAFC">Docker Sandboxed</text>
  </g>

  <!-- Badge 2: Zero Telemetry -->
  <g transform="translate(710, 436)">
    <rect width="162" height="40" rx="20" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="5" fill="#22C55E"/>
    <text x="34" y="26" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#F8FAFC">Zero Telemetry</text>
  </g>

  <!-- Badge 3: GitHub Action -->
  <g transform="translate(888, 436)">
    <rect width="162" height="40" rx="20" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="5" fill="#22C55E"/>
    <text x="34" y="26" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#F8FAFC">GitHub Action</text>
  </g>
</svg>
